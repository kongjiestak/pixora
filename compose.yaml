services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "${APM_BIND:-127.0.0.1}:8000:8000"
    environment:
      APM_READ_TOKEN: ${APM_READ_TOKEN:?Generate .env first}
      APM_WRITE_TOKEN: ${APM_WRITE_TOKEN:?Generate .env first}
      APM_STALE_SECONDS: "600"
    volumes:
      - apm-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  apm-data:
