services:
  monitor:
    build: .
    restart: unless-stopped
    ports:
      - "${PIXORA_BIND:-127.0.0.1}:8000:8000"
    environment:
      PIXORA_READ_TOKEN: ${PIXORA_READ_TOKEN:?Generate .env first}
      PIXORA_WRITE_TOKEN: ${PIXORA_WRITE_TOKEN:?Generate .env first}
      PIXORA_ALLOW_LEGACY_READ_TOKEN: ${PIXORA_ALLOW_LEGACY_READ_TOKEN:-true}
      PIXORA_STALE_SECONDS: "600"
    volumes:
      - pixora-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
volumes:
  pixora-data:
