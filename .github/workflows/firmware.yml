name: ESP32 prototype
on:
  push:
    branches: [main]
    paths: ['firmware/**', 'web/src/themes.js', 'web/src/layout-profile.js', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['firmware/**', 'web/src/themes.js', 'web/src/layout-profile.js', '.github/workflows/firmware.yml']
  workflow_dispatch:
concurrency:
  group: esp32-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-and-host-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check shared web and screen theme tokens
        run: node firmware/esp32/tools/generate_themes.mjs --check
      - name: Build first-screen prototype and test quota semantics
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.5
          target: esp32s3
          path: firmware/esp32
          command: idf.py build && CC=gcc ./host-tests/run.sh && cmake -S host-tests/ui -B build-ui-host -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ && cmake --build build-ui-host -j 4 && ./build-ui-host/ui-smoke
