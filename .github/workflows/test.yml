name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Audit submitted commits, not GitHub-generated PR merge identities.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-lock.txt -r clients/requirements-ble.txt && pip install --no-deps .
      - run: pytest -q
      - run: python scripts/audit_release.py
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: docker build -t pixora-ci .
      - name: Container runtime smoke
        env:
          PIXORA_READ_TOKEN: ci-read-only-test-value-000000000000000000
          PIXORA_WRITE_TOKEN: ci-write-only-test-value-00000000000000000
        run: |
          docker run -d --name pixora-smoke -p 127.0.0.1:8000:8000 -e PIXORA_READ_TOKEN -e PIXORA_WRITE_TOKEN pixora-ci
          trap 'code=$?; if [ "$code" -ne 0 ]; then docker logs --tail 80 pixora-smoke; fi; docker stop pixora-smoke; exit "$code"' EXIT
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 3 --retry-max-time 30 http://127.0.0.1:8000/healthz
          docker exec pixora-smoke python -m pixora.collector --plugin demo --once
          docker exec pixora-smoke python scripts/check_service.py
