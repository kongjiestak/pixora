[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "pixora-dashboard"
version = "0.7.0.dev1"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "qrcode>=8.2,<9"]
[project.optional-dependencies]
test = ["pytest>=9.0.3,<10"]
[project.scripts]
pixora-local = "pixora.local:main"
pixora-admin = "pixora.admin:main"
pixora-device = "pixora.devices:main"
pixora-collect = "pixora.collector:main"
apm-collect = "pixora.collector:main"
[tool.setuptools.packages.find]
include = ["pixora*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
